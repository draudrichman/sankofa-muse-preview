<style>
  :root { --ink: #f3e6cf; --dim: #a8957a; --gold: #e2ac52; --bg: #080605; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--ink); font-family: Manrope, system-ui, sans-serif; overflow: hidden; -webkit-tap-highlight-color: transparent; } /* no blue flash on taps */
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; } /* sideways drags are ours; vertical ones still scroll the page it's embedded in. A long press doesn't select or offer to save the image */
  #stage.hot { cursor: pointer; }
  #stage.turning { cursor: grabbing; }
  .vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 42%, transparent 50%, rgba(0,0,0,.55) 100%); }
  header { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 22px 28px; z-index: 2; pointer-events: none; }
  .brand { font-size: 11px; letter-spacing: .32em; text-transform: uppercase; color: var(--dim); }
  .brand b { color: var(--gold); font-weight: 600; }
  nav { display: flex; gap: 4px; pointer-events: auto; }
  nav button { background: none; border: 0; color: var(--dim); font: 600 11px Manrope, sans-serif; letter-spacing: .2em; text-transform: uppercase; padding: 9px 14px; border-radius: 999px; cursor: pointer; transition: color .3s, background .3s; }
  nav button:hover { color: var(--ink); }
  nav button[aria-pressed="true"] { color: var(--bg); background: var(--gold); }
  .copy { position: fixed; left: 28px; bottom: 30px; max-width: 440px; z-index: 2; pointer-events: none; }
  .copy > * { transition: opacity .45s ease, transform .45s ease; }
  .copy.swap > * { opacity: 0; transform: translateY(10px); }
  .eyebrow { font-size: 11px; letter-spacing: .3em; text-transform: uppercase; color: var(--gold); }
  h1 { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500; font-size: clamp(38px, 5vw, 66px); line-height: .98; margin: 12px 0 14px; }
  .cap { font-size: 14px; color: var(--dim); line-height: 1.55; }
  #inspect { position: fixed; right: 28px; bottom: 58px; z-index: 3; background: rgba(20, 14, 10, .7); border: 1px solid var(--dim); color: var(--dim); font: 600 10px Manrope, sans-serif; letter-spacing: .18em; text-transform: uppercase; padding: 8px 12px; border-radius: 999px; cursor: pointer; }
  #inspect[aria-pressed="true"] { color: var(--bg); background: var(--gold); border-color: var(--gold); }
  .hint { position: fixed; right: 28px; bottom: 30px; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--dim); z-index: 2; transition: opacity .4s; }
  #tags { position: fixed; inset: 0; pointer-events: none; z-index: 2; overflow: hidden; }
  .tag { position: absolute; left: 0; top: 0; will-change: transform; }
  .tag span { display: block; white-space: nowrap; font: 600 11px Manrope, sans-serif; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); background: rgba(12, 8, 6, .72); border: 1px solid rgba(226, 172, 82, .55); padding: 7px 12px; border-radius: 999px; opacity: 0; transition: opacity .4s ease, transform .4s ease; }
  .tag.up span { transform: translate(-50%, calc(-100% + 8px)); }
  .tag.up.on span { transform: translate(-50%, -100%); }
  .tag.down span { transform: translate(-50%, -8px); }
  .tag.down.on span { transform: translate(-50%, 0); }
  .tag.right span { transform: translate(-6px, -50%); }
  .tag.right.on span { transform: translate(0, -50%); }
  .tag.on span { opacity: 1; }
  #say { position: fixed; left: 0; top: 0; z-index: 3; pointer-events: none; will-change: transform; }
  #say span { position: absolute; right: 0; top: 0; transform: translate(-30px, -50%) scale(.8); transform-origin: right center; opacity: 0; transition: opacity .5s ease, transform .6s cubic-bezier(.2, .9, .3, 1.2); }
  #say.on span { opacity: 1; transform: translate(-54px, -50%) scale(1); }
  #say button { display: block; white-space: nowrap; font: italic 600 26px 'Cormorant Garamond', serif; letter-spacing: .02em; color: #1a120b; background: linear-gradient(180deg, #f0c574, #c98f3c); border: 0; border-radius: 999px; padding: 7px 26px 9px; box-shadow: 0 0 28px rgba(226, 172, 82, .35); cursor: pointer; }
  #say button:hover { box-shadow: 0 0 36px rgba(240, 197, 116, .6); }
  #say.on button { pointer-events: auto; }
  #say small { position: absolute; left: 50%; top: calc(100% + 10px); transform: translateX(-50%); white-space: nowrap; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); opacity: 0; transition: opacity .4s; }
  #say.pending small { opacity: 1; }
  #say i { position: absolute; top: 0; width: 9px; border-left: 1.5px solid var(--gold); border-radius: 50%; opacity: 0; }
  #say i:nth-child(1) { right: 8px; height: 12px; margin-top: -6px; }
  #say i:nth-child(2) { right: 20px; height: 20px; margin-top: -10px; }
  #say i:nth-child(3) { right: 32px; height: 28px; margin-top: -14px; }
  #say.on i { animation: speak 1.6s ease-out infinite; }
  #say.on i:nth-child(2) { animation-delay: .18s; }
  #say.on i:nth-child(3) { animation-delay: .36s; }
  @keyframes speak { 0% { opacity: 0; } 25% { opacity: .9; } 70%, 100% { opacity: 0; } }
  #loader { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 5; transition: opacity .9s; }
  #loader span { font: italic 500 24px 'Cormorant Garamond', serif; color: var(--dim); letter-spacing: .04em; }
  @media (max-width: 640px) {
    header { padding: 14px 12px; justify-content: center; }
    .brand { display: none; }
    nav { gap: 0; }
    nav button { padding: 8px 7px; font-size: 10px; letter-spacing: .08em; }
    #say button { font-size: 22px; padding: 6px 20px 8px; }
    #say.on span { transform: translate(-44px, -50%) scale(1); }
    #say small { font-size: 9px; letter-spacing: .1em; }
    .copy { left: 16px; right: 16px; bottom: 18px; }
    .cap { font-size: 13px; }
    .hint { display: none; }
    .tag span { font-size: 10px; letter-spacing: .16em; padding: 6px 10px; }
  }
  @media (prefers-reduced-motion: reduce) { .copy > *, #say span { transition: none; } #say.on i { animation: none; opacity: .6; } }
</style>
